
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente CDA</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      color: #1e293b;
    }

    .contenedor {
      max-width: 850px;
      margin: 25px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
      overflow: hidden;
    }

    header {
      background: #123b66;
      color: white;
      padding: 22px;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #dbeafe; }

    .volver {
      display: inline-block;
      margin-top: 15px;
      color: white;
      text-decoration: none;
    }

    #mensajes {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
    }

    .mensaje {
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .agente { background: #eaf2fb; }

    .usuario {
      background: #d9f7e8;
      margin-left: 45px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e2e8f0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    @media (max-width: 600px) {
      .contenedor { margin: 0; border-radius: 0; }
      #mensajes { height: 65vh; }
    }
  </style>
</head>

<body>
  <main class="contenedor">

    <header>
      <h1>Asistente CDA</h1>
      <p>Tu asistente administrativo y técnico</p>
      <a class="volver" href="/">← Volver al menú principal</a>
    </header>

    <section id="mensajes" aria-live="polite">
      <div class="mensaje agente">
        ¡Hola! Soy tu Asistente CDA. Estoy aquí para ayudarte con temas técnicos, administrativos, normativos y operativos de los CDA.
      </div>
    </section>

    <form id="formulario">
      <input
        id="entrada"
        type="text"
        placeholder="Escribe tu pregunta..."
        autocomplete="off"
        required
      >
      <button id="enviar" type="submit">Enviar</button>
    </form>

  </main>

  <script>
    const formulario = document.getElementById("formulario");
    const entrada = document.getElementById("entrada");
    const mensajes = document.getElementById("mensajes");
    const boton = document.getElementById("enviar");
    const sessionId = crypto.randomUUID();

    function agregarMensaje(texto, tipo) {
      const elemento = document.createElement("div");
      elemento.className = "mensaje " + tipo;
      elemento.textContent = texto;
      mensajes.appendChild(elemento);
      mensajes.scrollTop = mensajes.scrollHeight;
      return elemento;
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const mensaje = entrada.value.trim();
      if (!mensaje) return;

      agregarMensaje(mensaje, "usuario");
      entrada.value = "";
      boton.disabled = true;

      const espera = agregarMensaje("Consultando al Asistente CDA...", "agente");

      try {
        const respuesta = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mensaje,
            sessionId,
            asistente: "cda"
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(datos.error || "Error al consultar.");
        }

        espera.textContent = datos.respuesta;

      } catch (error) {
        espera.textContent = "No se pudo obtener respuesta: " + error.message;
      } finally {
        boton.disabled = false;
        entrada.focus();
        mensajes.scrollTop = mensajes.scrollHeight;
      }
    });
  </script>
</body>
</html>
